[project]
name = "qwave"
version = "0.0.2"
description = "Lightweight music-only media server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",           # API routing
    "uvicorn[standard]>=0.24.0",  # AGSI webserver
    "sqlalchemy>=2.0.0",          # SQL queries + orm
    "mutagen>=1.47.0",            # audio metadata
    "bcrypt>=4.0.0",              # authentication
    "python-multipart>=0.0.6",    # file uploads and streaming
    "pyyaml>=6.0",                # process yaml for config n stuff
    "elevate>=0.1.3",             # for qwave_init
    "httpx>=0.27.0",              # musicbrainz api calls
    "python-magic>=0.4.27",       # file type detection
]
license = "GPL-3.0-only"
license-files = ["LICENSE"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["uv_build >= 0.7.19, <0.9.0"]
build-backend = "uv_build"

[project.scripts]
qwave        = "qwave.main:entry"
qwave_init   = "qwave.cli.init:entry"
qwave_upload = "qwave.cli.bulk_import:entry"

[tool.setuptools.packages.find]
where = ["src"]